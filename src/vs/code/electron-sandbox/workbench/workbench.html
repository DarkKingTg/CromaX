<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="
				default-src
					'none'
				;
				img-src
					'self'
					data:
					blob:
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https:
				;
				media-src
					'self'
				;
				frame-src
					'self'
					vscode-webview:
				;
				script-src
					'self'
					'unsafe-eval'
					blob:
				;
				style-src
					'self'
					'unsafe-inline'
				;
				connect-src
					'self'
					https:
					ws:
				;
				font-src
					'self'
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https://*.vscode-unpkg.net
				;
				require-trusted-types-for
					'script'
				;
				trusted-types
					amdLoader
					cellRendererEditorText
					defaultWorkerFactory
					diffEditorWidget
					diffReview
					domLineBreaksComputer
					dompurify
					editorGhostText
					editorViewLayer
					notebookRenderer
					stickyScrollViewLayer
					tokenizeToString
					notebookChatEditController
				;
		"/>

		<!-- Workbench CSS -->
		<link rel="stylesheet" href="../../../workbench/workbench.desktop.main.css">
	</head>

	<body aria-label="">
		<div id="cromax-loading-splash" style="
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background-color: #0e0f12;
			z-index: 999999;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			user-select: none;
			color: #ffffff;
		">
			<style>
				@keyframes cromax-pulse {
					0% { transform: scale(0.95); opacity: 0.7; box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
					70% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 0 20px rgba(99, 102, 241, 0); }
					100% { transform: scale(0.95); opacity: 0.7; box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
				}
				@keyframes cromax-bar {
					0% { left: -40%; width: 40%; }
					50% { left: 20%; width: 60%; }
					100% { left: 100%; width: 40%; }
				}
				.cromax-icon-ring {
					width: 72px;
					height: 72px;
					border-radius: 50%;
					background: linear-gradient(135deg, #6366f1, #a855f7);
					display: flex;
					align-items: center;
					justify-content: center;
					animation: cromax-pulse 2s infinite ease-in-out;
					margin-bottom: 24px;
				}
				.cromax-title {
					font-size: 26px;
					font-weight: 500;
					letter-spacing: 1px;
					background: linear-gradient(135deg, #ffffff, #a855f7);
					-webkit-background-clip: text;
					-webkit-text-fill-color: transparent;
					margin-bottom: 24px;
				}
				.cromax-bar-track {
					width: 180px;
					height: 3px;
					background: rgba(255, 255, 255, 0.1);
					border-radius: 4px;
					overflow: hidden;
					position: relative;
				}
				.cromax-bar-fill {
					position: absolute;
					height: 100%;
					background: linear-gradient(90deg, #6366f1, #a855f7);
					border-radius: 4px;
					animation: cromax-bar 1.6s infinite ease-in-out;
				}
			</style>

			<div class="cromax-icon-ring">
				<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
				</svg>
			</div>

			<div class="cromax-title">CromaX IDE</div>

			<div class="cromax-bar-track">
				<div class="cromax-bar-fill"></div>
			</div>
		</div>
	</body>

	<!-- Startup (do not modify order of script tags!) -->
	<script src="./workbench.js" type="module"></script>
</html>
