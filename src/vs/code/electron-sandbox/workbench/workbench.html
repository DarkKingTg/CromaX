<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="
				default-src
					'none'
				;
				img-src
					'self'
					data:
					blob:
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https:
				;
				media-src
					'self'
				;
				frame-src
					'self'
					vscode-webview:
				;
				script-src
					'self'
					'unsafe-eval'
					blob:
				;
				style-src
					'self'
					'unsafe-inline'
				;
				connect-src
					'self'
					https:
					ws:
				;
				font-src
					'self'
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https://*.vscode-unpkg.net
				;
				require-trusted-types-for
					'script'
				;
				trusted-types
					amdLoader
					cellRendererEditorText
					defaultWorkerFactory
					diffEditorWidget
					diffReview
					domLineBreaksComputer
					dompurify
					editorGhostText
					editorViewLayer
					notebookRenderer
					stickyScrollViewLayer
					tokenizeToString
					notebookChatEditController
				;
		"/>

		<!-- Workbench CSS -->
		<link rel="stylesheet" href="../../../workbench/workbench.desktop.main.css">
	</head>

	<body aria-label="">
		<div id="cromax-loading-splash" style="
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background-color: #090a0f;
			background-image: radial-gradient(circle at 50% 42%, rgba(99, 102, 241, 0.14) 0%, rgba(168, 85, 247, 0.07) 35%, transparent 70%);
			z-index: 999999;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			user-select: none;
			color: #ffffff;
			box-sizing: border-box;
			will-change: transform, opacity, filter;
		">
			<style>
				@keyframes cromax-float {
					0% { transform: translateY(0px) scale(1); }
					50% { transform: translateY(-7px) scale(1.02); }
					100% { transform: translateY(0px) scale(1); }
				}
				@keyframes cromax-spin-ring {
					0% { transform: rotate(0deg); }
					100% { transform: rotate(360deg); }
				}
				@keyframes cromax-aura-pulse {
					0% { opacity: 0.55; transform: scale(0.95); filter: blur(20px); }
					50% { opacity: 0.95; transform: scale(1.1); filter: blur(30px); }
					100% { opacity: 0.55; transform: scale(0.95); filter: blur(20px); }
				}
				@keyframes cromax-apple-progress {
					0% { left: -35%; width: 35%; }
					50% { left: 30%; width: 45%; }
					100% { left: 100%; width: 25%; }
				}
				.cromax-apple-card {
					position: relative;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					padding: 44px 56px;
					border-radius: 38px;
					background: rgba(255, 255, 255, 0.035);
					backdrop-filter: blur(45px) saturate(200%);
					-webkit-backdrop-filter: blur(45px) saturate(200%);
					border: 1px solid rgba(255, 255, 255, 0.1);
					box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.18);
					animation: cromax-float 3.6s ease-in-out infinite;
				}
				.cromax-ambient-aura {
					position: absolute;
					width: 140px;
					height: 140px;
					border-radius: 50%;
					background: radial-gradient(circle, rgba(168, 85, 247, 0.45) 0%, rgba(99, 102, 241, 0.25) 60%, transparent 100%);
					animation: cromax-aura-pulse 3.6s ease-in-out infinite;
					z-index: 0;
					pointer-events: none;
				}
				.cromax-icon-container {
					position: relative;
					width: 76px;
					height: 76px;
					border-radius: 22px;
					display: flex;
					align-items: center;
					justify-content: center;
					background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
					border: 1px solid rgba(255, 255, 255, 0.16);
					box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.3);
					margin-bottom: 20px;
					z-index: 1;
				}
				.cromax-spinner-ring {
					position: absolute;
					inset: -5px;
					border-radius: 26px;
					border: 2px solid transparent;
					border-top-color: #a855f7;
					border-right-color: #6366f1;
					border-bottom-color: #ec4899;
					animation: cromax-spin-ring 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
				}
				.cromax-logo-img {
					width: 46px;
					height: 46px;
					position: relative;
					z-index: 2;
				}
				.cromax-brand-name {
					font-size: 26px;
					font-weight: 700;
					letter-spacing: -0.5px;
					background: linear-gradient(135deg, #ffffff 30%, #d8b4fe 100%);
					-webkit-background-clip: text;
					-webkit-text-fill-color: transparent;
					margin-bottom: 6px;
					z-index: 1;
				}
				.cromax-status-pill {
					display: flex;
					align-items: center;
					gap: 6px;
					font-size: 11px;
					font-weight: 600;
					letter-spacing: 0.6px;
					text-transform: uppercase;
					color: rgba(255, 255, 255, 0.55);
					margin-bottom: 22px;
					z-index: 1;
				}
				.cromax-status-dot {
					width: 6px;
					height: 6px;
					border-radius: 50%;
					background-color: #a855f7;
					box-shadow: 0 0 8px #a855f7;
				}
				.cromax-track {
					width: 140px;
					height: 4px;
					background: rgba(255, 255, 255, 0.08);
					border-radius: 99px;
					overflow: hidden;
					position: relative;
					z-index: 1;
				}
				.cromax-fill {
					position: absolute;
					height: 100%;
					background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
					border-radius: 99px;
					animation: cromax-apple-progress 1.6s infinite cubic-bezier(0.16, 1, 0.3, 1);
				}
			</style>

			<div class="cromax-apple-card">
				<div class="cromax-ambient-aura"></div>
				<div class="cromax-icon-container">
					<div class="cromax-spinner-ring"></div>
					<img class="cromax-logo-img" src="../../../../../resources/cromax-logo.svg" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" alt="CromaX Logo" />
					<svg class="cromax-logo-img" style="display:none;" viewBox="0 0 100 100" width="46" height="46">
						<circle cx="50" cy="50" r="42" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.4" />
						<path d="M 68,32 A 26,26 0 1,0 68,68 L 56,58 A 12,12 0 1,1 56,42 Z" fill="url(#crmxG)" />
						<defs><linearGradient id="crmxG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs>
					</svg>
				</div>

				<div class="cromax-brand-name">CromaX</div>
				<div class="cromax-status-pill">
					<div class="cromax-status-dot"></div>
					<span>Studio Engine</span>
				</div>

				<div class="cromax-track">
					<div class="cromax-fill"></div>
				</div>
			</div>
		</div>
	</body>

	<!-- Startup (do not modify order of script tags!) -->
	<script src="./workbench.js" type="module"></script>
</html>
