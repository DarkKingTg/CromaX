<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="
				default-src
					'none'
				;
				img-src
					'self'
					data:
					blob:
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https:
				;
				media-src
					'self'
				;
				frame-src
					'self'
					vscode-webview:
				;
				script-src
					'self'
					'unsafe-eval'
					blob:
				;
				style-src
					'self'
					'unsafe-inline'
				;
				connect-src
					'self'
					https:
					ws:
				;
				font-src
					'self'
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https://*.vscode-unpkg.net
				;
				require-trusted-types-for
					'script'
				;
				trusted-types
					amdLoader
					cellRendererEditorText
					defaultWorkerFactory
					diffEditorWidget
					diffReview
					domLineBreaksComputer
					dompurify
					editorGhostText
					editorViewLayer
					notebookRenderer
					stickyScrollViewLayer
					tokenizeToString
					notebookChatEditController
				;
		"/>

		<!-- Workbench CSS -->
		<link rel="stylesheet" href="../../../workbench/workbench.desktop.main.css">
	</head>

	<body aria-label="">
		<div id="cromax-loading-splash" style="
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background-color: #0a0b0d;
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			z-index: 999999;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
			user-select: none;
			color: #ffffff;
			box-sizing: border-box;
		">
			<style>
				@keyframes cromax-spin {
					0% { transform: rotate(0deg); }
					100% { transform: rotate(360deg); }
				}
				@keyframes cromax-pulse-glow {
					0% { opacity: 0.6; filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4)); }
					50% { opacity: 1; filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.8)); }
					100% { opacity: 0.6; filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4)); }
				}
				@keyframes cromax-progress-bar {
					0% { left: -40%; width: 40%; }
					50% { left: 25%; width: 50%; }
					100% { left: 100%; width: 30%; }
				}
				.cromax-logo-wrapper {
					position: relative;
					width: 88px;
					height: 88px;
					display: flex;
					align-items: center;
					justify-content: center;
					margin-bottom: 24px;
				}
				.cromax-spinner-ring {
					position: absolute;
					inset: 0;
					border-radius: 50%;
					border: 2px solid transparent;
					border-top-color: #6366f1;
					border-right-color: #a855f7;
					animation: cromax-spin 1.4s linear infinite;
				}
				.cromax-logo-img {
					width: 52px;
					height: 52px;
					animation: cromax-pulse-glow 2.5s infinite ease-in-out;
				}
				.cromax-brand-name {
					font-size: 24px;
					font-weight: 600;
					letter-spacing: 1.5px;
					background: linear-gradient(135deg, #ffffff 30%, #a855f7 100%);
					-webkit-background-clip: text;
					-webkit-text-fill-color: transparent;
					margin-bottom: 24px;
				}
				.cromax-track {
					width: 160px;
					height: 3px;
					background: rgba(255, 255, 255, 0.08);
					border-radius: 99px;
					overflow: hidden;
					position: relative;
				}
				.cromax-fill {
					position: absolute;
					height: 100%;
					background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
					border-radius: 99px;
					animation: cromax-progress-bar 1.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
				}
			</style>

			<div class="cromax-logo-wrapper">
				<div class="cromax-spinner-ring"></div>
				<!-- Placeholder logo SVG file: resources/cromax-logo.svg -->
				<img class="cromax-logo-img" src="../../../../resources/cromax-logo.svg" alt="CromaX Logo" />
			</div>

			<div class="cromax-brand-name">CromaX</div>

			<div class="cromax-track">
				<div class="cromax-fill"></div>
			</div>
		</div>
	</body>

	<!-- Startup (do not modify order of script tags!) -->
	<script src="./workbench.js" type="module"></script>
</html>
