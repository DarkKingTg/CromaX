[project]
name = "cromax-orchestrator"
version = "0.1.0"
description = "Event-sourced AI Agent Orchestrator for CromaX IDE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.80.0",
    "pydantic>=2.7.0",
    "websockets>=13.0",
    "mcp>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

